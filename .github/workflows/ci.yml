name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        run: cargo build --release --target ${{ matrix.target }} -p karta-desktop

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../karta-linux-${{ matrix.target }}.tar.gz karta
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karta-linux-${{ matrix.target }}
          path: karta-linux-${{ matrix.target }}.tar.gz
          retention-days: 30

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        run: cargo build --release --target ${{ matrix.target }} -p karta-desktop

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../karta-windows-${{ matrix.target }}.zip karta.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karta-windows-${{ matrix.target }}
          path: karta-windows-${{ matrix.target }}.zip
          retention-days: 30

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build desktop app
        run: cargo build --release --target ${{ matrix.target }} -p karta-desktop

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../karta-macos-${{ matrix.target }}.tar.gz karta
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karta-macos-${{ matrix.target }}
          path: karta-macos-${{ matrix.target }}.tar.gz
          retention-days: 30
